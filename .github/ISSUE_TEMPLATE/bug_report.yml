name: Bug report
description: Report a reproducible problem with tsray.
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities in a public issue. Use
        [private vulnerability reporting](https://github.com/yanulabs/tsray/security/advisories/new)
        instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest command sequence, configuration, or code sample that reproduces the problem.
      placeholder: |
        tsray version
        tsray index /path/to/project
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and relevant output. Remove secrets and private source data.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Help us reproduce your setup.
      placeholder: |
        - tsray version:
        - Node.js version:
        - npm version:
        - Operating system:
        - MCP client and version (if applicable):
        - Target project TypeScript/React versions (if relevant):
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, related issues, or workarounds.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
