name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is difficult today?
      placeholder: Describe the workflow or limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like tsray to provide.
      placeholder: Include example commands, tool calls, configuration, or output when useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you tried?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, related issues, or implementation ideas.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and pull requests for this proposal.
          required: true
        - label: This request does not describe an unreported security vulnerability.
          required: true
